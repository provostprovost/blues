name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write      # Creates the release
      id-token: write      # Generates the signing certificate
      attestations: write  # Attaches the build attestation
    with:
      build: |
        V="${GITHUB_REF_NAME#v}"
        V="${V:-0.0}"
        BOARD=smk37 sh build.sh
        BOARD=smk37 MODEL=elite sh build.sh
        BOARD=smk37 MODEL=mke sh build.sh
        sh build.sh
        BOARD=smk37 sh build.sh --release "$V"
        BOARD=smk37 MODEL=elite sh build.sh --release "$V"
        BOARD=smk37 MODEL=mke sh build.sh --release "$V"
        sh build.sh --release "$V"
        sh tests/run_tests.sh
      packages: build/bluesbox-[0-9]*.fwsc
